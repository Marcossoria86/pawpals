services:
  - type: web
    name: pawpals-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # Pega aquí la URL del sitio estático (pawpals-web) una vez creado, ej: https://pawpals-web.onrender.com

  - type: web
    name: pawpals-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false # Pega aquí la URL del servicio pawpals-api una vez creado, ej: https://pawpals-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
