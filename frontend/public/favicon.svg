<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícono de PawPals: dos huellitas de pata (como el emoji 🐾, pero
       dibujado a mano para que no dependa de la fuente de emojis del
       sistema) sobre el color de marca. Mismas proporciones que el resto de
       los íconos de la app (ver /tmp/gen_icons.py usado para los PNG). -->
  <rect width="64" height="64" rx="14" fill="#c9683f" />
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="0.16" rx="0.28" ry="0.20" />
      <ellipse cx="-0.28" cy="-0.10" rx="0.10" ry="0.13" />
      <ellipse cx="-0.10" cy="-0.26" rx="0.10" ry="0.135" />
      <ellipse cx="0.10" cy="-0.26" rx="0.10" ry="0.135" />
      <ellipse cx="0.28" cy="-0.10" rx="0.10" ry="0.13" />
    </g>
  </defs>
  <g fill="#f5f3ee">
    <use href="#paw" transform="translate(38.4,39.68) rotate(-18) scale(32)" />
    <use href="#paw" transform="translate(20.48,20.48) rotate(-18) scale(19.2)" />
  </g>
</svg>
