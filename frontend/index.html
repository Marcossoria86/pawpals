<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PawPals</title>

    <!-- PWA: permite "agregar a inicio" y que abra en pantalla completa,
         sin la barra del navegador, tanto en Android como en iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="La red social para tu mascota." />

    <!-- Meta tags específicos de iOS/Safari: sin estos, "agregar a inicio"
         en un iPhone abre igual pero se ve como una pestaña de Safari en
         vez de una app real (con su propia barra de estado y sin la UI
         del navegador). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PawPals" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
